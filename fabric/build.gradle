buildscript {
    dependencies {
        classpath "fabric-loom:fabric-loom.gradle.plugin:1.13-SNAPSHOT"
    }
}

plugins {
    id 'multiloader-loader'
    id "com.modrinth.minotaur" version "2.+"
}

if (parchment_version == null) {
    project.tasks.configureEach { enabled = false }
    println "Skipping Fabric project as dependency isn't supported"
    return
}

apply plugin: 'fabric-loom'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

base {
    archivesName = "${mod_id}-fabric[${VersionUtil.getDirectory(project.rootDir.toString(), project.minecraft_version).getName()}]"
}

apply from: file("${project.rootDir}/versions/builds/fabric.gradle")

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}


sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

tasks.withType(Javadoc).configureEach {
    enabled = false
}


modrinth {
    token       = project.modrinthTOKEN
    projectId   = project.modrinthID     // numeric ID or slug
    versionNumber = project.version.toString()     // or manually set
    versionName   = project.mod_name.toString()+" "+project.version.toString()     // optional
    changelog     = file(rootDir.toString()+"/CHANGELOG.md").text       // or a string
    loaders       = ["fabric"]
    gameVersions  = project.minecraft_version_range.toList()
    uploadFile    = tasks.named("remapJar")
    versionType  = project.modrinthStatus
}